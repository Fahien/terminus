{% if config.extra.content_security_policy.enable == true -%}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'
    {%- set allowed_domains = [] -%}

    {#- Allow WebSocket protocol if served via `zola serve` -#}
    {%- if config.mode == "serve" -%}
        {%- set connect_src = load_data(literal=`{"directive": "connect-src", "domains": ["'self'", "ws:"]}`, format="json") -%}
        {%- set script_src_elem = load_data(literal=`{"directive": "script-src-elem", "domains": ["'self'", "'unsafe-inline'"]}`, format="json") -%}
        {%- set allowed_domains = [...allowed_domains, connect_src, script_src_elem] -%}
    {%- endif -%}

    {#- Allow `data:` URL scheme if emoji-based favicon is used -#}
    {%- if config.extra.favicon_emoji -%}
        {%- set img_src = load_data(literal=`{"directive": "img-src", "domains":["'self'", "data:"]}`, format="json") -%}
        {%- set allowed_domains = [...allowed_domains, img_src] -%}
    {%- endif -%}

    {#- Allow inline CSS if Zola syntax highlighting uses inline styles -#}
    {%- if config.markdown.highlighting.style and config.markdown.highlighting.style == "inline" -%}
        {%- set style_src = load_data(literal=`{"directive": "style-src-attr", "domains": ["'unsafe-inline'"]}`, format="json") -%}
        {%- set allowed_domains = [...allowed_domains, style_src] -%}
    {%- endif -%}

    {%- set extra_domains = config.extra.content_security_policy.allowed_domains -%}
    {%- set allowed_domains = [...allowed_domains, ...extra_domains] -%}

    {#- `group_by` returns an unordered map, so walk the keys in sorted order to -#}
    {#- keep the emitted header stable from one build to the next. -#}
    {%- set by_directive = allowed_domains | group_by(attribute="directive") -%}
    {%- for directive in by_directive | keys | sort -%}
        {%- set_global domains = [] -%}

        {%- for entry in by_directive[directive] -%}
            {%- set_global domains = [...domains, ...entry.domains] | unique -%}
        {%- endfor -%}

        {%- set domains = domains | join(sep=" ") -%}
        {%- if domains -%}
            ; {{ directive }} {{ domains | safe }}
        {%- endif -%}
    {%- endfor -%}
">
{% endif -%}
